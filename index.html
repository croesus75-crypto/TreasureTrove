<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미술품 컬렉션 관리 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->

    <style>

    <!-- IndexedDB & Main Script -->
    <script>
        // IndexedDB Configuration
        const DB_NAME = 'ArtVaultDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'artworks';
        let db = null;

        // Admin State
        let isAdmin = false;
        let adminPassword = localStorage.getItem('artVault_password') || '1234';
        let artworks = [];
        let viewMode = 'grid'; // 'grid' | 'list'
        let currentHistoryArtId = null;

        // Initialize Database
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function loadArtworks() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => {
                    artworks = req.result || [];
                    resolve();
                };
                req.onerror = () => reject(req.error);
            });
        }

        async function saveArtworkToDB(art) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.put(art);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        async function deleteArtworkFromDB(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const req = store.delete(id);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // App Initialization
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initDB();
                await loadArtworks();
                updateAdminUI();
                renderApp();
            } catch (err) {
                console.error("DB Initialization Error:", err);
            }
        });

        // Admin Lock/Unlock Logic
        function toggleAdminModal() {
            if (isAdmin) {
                isAdmin = false;
                updateAdminUI();
                renderApp();
            } else {
                document.getElementById('adminPasswordInput').value = '';
                document.getElementById('authModal').classList.remove('hidden');
            }
        }

        function closeAdminModal() {
            document.getElementById('authModal').classList.add('hidden');
        }

        function verifyAdmin() {
            const inputPw = document.getElementById('adminPasswordInput').value;
            if (inputPw === adminPassword) {
                isAdmin = true;
                closeAdminModal();
                updateAdminUI();
                renderApp();
            } else {
                alert('비밀번호가 올바르지 않습니다.');
            }
        }

        function updateAdminUI() {
            const btnText = document.getElementById('adminBtnText');
            const authBtn = document.getElementById('adminAuthBtn');
            if (isAdmin) {
                document.body.classList.add('is-admin');
                btnText.textContent = '로그아웃';
                authBtn.classList.replace('bg-slate-800', 'bg-red-600');
                authBtn.classList.replace('hover:bg-slate-700', 'hover:bg-red-700');
            } else {
                document.body.classList.remove('is-admin');
                btnText.textContent = '관리자 로그인';
                authBtn.classList.replace('bg-red-600', 'bg-slate-800');
                authBtn.classList.replace('hover:bg-red-700', 'hover:bg-slate-700');
            }
        }

        function openChangePasswordModal() {
            document.getElementById('curPwInput').value = '';
            document.getElementById('newPwInput').value = '';
            document.getElementById('changePwModal').classList.remove('hidden');
        }

        function closeChangePasswordModal() {
            document.getElementById('changePwModal').classList.add('hidden');
        }

        function saveNewPassword() {
            const curPw = document.getElementById('curPwInput').value;
            const newPw = document.getElementById('newPwInput').value;
            if (curPw !== adminPassword) {
                alert('현재 비밀번호가 올바르지 않습니다.');
                return;
            }
            if (!newPw) {
                alert('새 비밀번호를 입력해주세요.');
                return;
            }
            adminPassword = newPw;
            localStorage.setItem('artVault_password', newPw);
            alert('비밀번호가 성공적으로 변경되었습니다.');
            closeChangePasswordModal();
        }

        // Render Main View & Dashboard
        function renderApp() {
            populateGalleryFilter();
            calculateDashboardStats();

            const search = document.getElementById('searchInput').value.toLowerCase();
            const genre = document.getElementById('genreFilter').value;
            const gallery = document.getElementById('galleryFilter').value;

            const filtered = artworks.filter(a => {
                const matchSearch = (a.artist && a.artist.toLowerCase().includes(search)) ||
                                    (a.title && a.title.toLowerCase().includes(search)) ||
                                    (a.medium && a.medium.toLowerCase().includes(search));
                const matchGenre = genre ? a.genre === genre : true;
                const matchGallery = gallery ? a.gallery === gallery : true;
                return matchSearch && matchGenre && matchGallery;
            });

            const container = document.getElementById('artworkContainer');
            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-slate-400 bg-white rounded-2xl border border-dashed"><i class="fa-solid fa-palette text-4xl mb-2"></i><p>등록된 작품이 없거나 검색 결과가 없습니다.</p></div>`;
                return;
            }

            if (viewMode === 'grid') {
                renderGrid(filtered, container);
            } else {
                renderList(filtered, container);
            }
        }

        function populateGalleryFilter() {
            const select = document.getElementById('galleryFilter');
            const currentVal = select.value;
            const galleries = [...new Set(artworks.map(a => a.gallery).filter(Boolean))];
            select.innerHTML = '<option value="">전체 구입 갤러리</option>';
            galleries.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                if (g === currentVal) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function calculateDashboardStats() {
            document.getElementById('statTotalCount').textContent = `${artworks.length}점`;
            let totalPurchase = 0;
            let totalCurrent = 0;

            artworks.forEach(a => {
                totalPurchase += Number(a.purchasePrice) || 0;
                totalCurrent += Number(a.currentPrice) || Number(a.purchasePrice) || 0;
            });

            const diff = totalCurrent - totalPurchase;
            const rate = totalPurchase > 0 ? ((diff / totalPurchase) * 100).toFixed(1) : 0;

            document.getElementById('statTotalPurchase').textContent = `₩${totalPurchase.toLocaleString()}`;
            document.getElementById('statTotalCurrent').textContent = `₩${totalCurrent.toLocaleString()}`;
            
            const profitElem = document.getElementById('statTotalProfit');
            profitElem.textContent = `₩${diff >= 0 ? '+' : ''}${diff.toLocaleString()} (${rate >= 0 ? '+' : ''}${rate}%)`;
            profitElem.className = `text-2xl font-bold ${diff >= 0 ? 'text-emerald-600' : 'text-red-600'}`;
        }

        function renderGrid(items, container) {
            container.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6";
            container.innerHTML = items.map(art => {
                const purchase = Number(art.purchasePrice) || 0;
                const current = Number(art.currentPrice) || purchase;
                const diff = current - purchase;
                const rate = purchase > 0 ? ((diff / purchase) * 100).toFixed(1) : 0;

                return `
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col">
                    <div class="relative bg-slate-100 h-64 overflow-hidden group">
                        <img src="${art.frontImg || 'https://via.placeholder.com/400x400?text=No+Image'}" id="img-front-${art.id}" class="w-full h-full object-cover">
                        ${art.backImg ? `
                        <img src="${art.backImg}" id="img-back-${art.id}" class="w-full h-full object-cover hidden">
                        <div class="absolute top-2 right-2 bg-slate-900/70 text-white text-[10px] px-2 py-1 rounded-full backdrop-blur-sm flex gap-1">
                            <button onclick="switchImg('${art.id}', 'front')" class="hover:underline font-bold">앞면</button> |
                            <button onclick="switchImg('${art.id}', 'back')" class="hover:underline font-bold">뒷면</button>
                        </div>
                        ` : ''}
                        <span class="absolute top-2 left-2 bg-indigo-600 text-white text-[10px] font-semibold px-2 py-0.5 rounded-md shadow">${art.genre || '기타'}</span>
                    </div>

                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <div class="text-xs text-slate-500 font-medium mb-0.5">${art.artist || '미상'}</div>
                            <h4 class="font-bold text-slate-900 text-base leading-snug">${art.title || '무제'} ${art.year ? `<span class="font-normal text-slate-400 text-xs">(${art.year})</span>` : ''}</h4>
                            <p class="text-xs text-slate-500 mt-1">${art.size || ''} ${art.medium ? `• ${art.medium}` : ''}</p>
                        </div>

                        <!-- Admin Only Price Block -->
                        <div class="admin-only border-t pt-2 space-y-1">
                            <div class="flex justify-between items-baseline text-xs">
                                <span class="text-slate-400">구입가</span>
                                <span class="font-medium text-slate-700">₩${purchase.toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between items-baseline">
                                <span class="text-xs text-slate-400">현재 평가가</span>
                                <span class="font-bold text-indigo-600 text-sm">₩${current.toLocaleString()}</span>
                            </div>
                            <div class="flex justify-between items-center text-[11px] pt-1 border-t border-dashed">
                                <span class="text-slate-400">수익률</span>
                                <span class="font-semibold ${diff >= 0 ? 'text-emerald-600' : 'text-red-600'}">
                                    ${diff >= 0 ? '▲' : '▼'} ₩${Math.abs(diff).toLocaleString()} (${rate}%)
                                </span>
                            </div>
                            ${art.gallery ? `<div class="text-[11px] text-slate-400 text-right">🏛️ ${art.gallery}</div>` : ''}
                        </div>

                        <!-- Admin Actions -->
                        <div class="admin-only flex items-center justify-end gap-2 pt-2 border-t">
                            <button onclick="openHistoryModal('${art.id}')" class="text-xs text-slate-500 hover:text-indigo-600 p-1" title="시세 추적"><i class="fa-solid fa-chart-line"></i></button>
                            <button onclick="editArtwork('${art.id}')" class="text-xs text-slate-500 hover:text-amber-600 p-1" title="수정"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteArtwork('${art.id}')" class="text-xs text-slate-500 hover:text-red-600 p-1" title="삭제"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderList(items, container) {
            container.className = "bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm";
            container.innerHTML = `
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left text-slate-600">
                    <thead class="bg-slate-50 text-slate-700 border-b">
                        <tr>
                            <th class="p-3">이미지</th>
                            <th class="p-3">작가명</th>
                            <th class="p-3">작품명</th>
                            <th class="p-3">크기 / 재료</th>
                            <th class="p-3 admin-only">구입가</th>
                            <th class="p-3 admin-only">현재 평가가</th>
                            <th class="p-3 admin-only">손익 (수익률)</th>
                            <th class="p-3 admin-only">구입 갤러리</th>
                            <th class="p-3 text-right admin-only">관리</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">
                        ${items.map(art => {
                            const purchase = Number(art.purchasePrice) || 0;
                            const current = Number(art.currentPrice) || purchase;
                            const diff = current - purchase;
                            const rate = purchase > 0 ? ((diff / purchase) * 100).toFixed(1) : 0;
                            return `
                            <tr class="hover:bg-slate-50">
                                <td class="p-3">
                                    <img src="${art.frontImg || 'https://via.placeholder.com/100'}" class="w-12 h-12 object-cover rounded-lg border">
                                </td>
                                <td class="p-3 font-semibold text-slate-900">${art.artist || '-'}</td>
                                <td class="p-3 font-medium text-slate-800">${art.title \vert{}\vert{} '-'}${art.year ? `<span class="text-slate-400">(${art.year})</span>` : ''}</td>
                                <td class="p-3">${art.size || '-'} <br><span class="text-slate-400">${art.medium || ''}</span></td>
                                <td class="p-3 admin-only">₩${purchase.toLocaleString()}</td>
                                <td class="p-3 admin-only font-bold text-indigo-600">₩${current.toLocaleString()}</td>
                                <td class="p-3 admin-only font-semibold ${diff >= 0 ? 'text-emerald-600' : 'text-red-600'}">
                                    ₩${diff.toLocaleString()} (${rate}%)
                                </td>
                                <td class="p-3 admin-only">${art.gallery || '-'}</td>
                                <td class="p-3 text-right space-x-1 admin-only">
                                    <button onclick="openHistoryModal('${art.id}')" class="p-1 text-slate-400 hover:text-indigo-600"><i class="fa-solid fa-chart-line"></i></button>
                                    <button onclick="editArtwork('${art.id}')" class="p-1 text-slate-400 hover:text-amber-600"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteArtwork('${art.id}')" class="p-1 text-slate-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            </div>
            `;
        }

        function switchImg(id, type) {
            const front = document.getElementById(`img-front-${id}`);
            const back = document.getElementById(`img-back-${id}`);
            if (!front || !back) return;
            if (type === 'front') {
                front.classList.remove('hidden');
                back.classList.add('hidden');
            } else {
                front.classList.add('hidden');
                back.classList.remove('hidden');
            }
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('btnViewGrid').className = `p-2 border rounded-lg ${mode === 'grid' ? 'bg-slate-100 text-indigo-600 font-bold' : 'text-slate-600'}`;
            document.getElementById('btnViewList').className = `p-2 border rounded-lg ${mode === 'list' ? 'bg-slate-100 text-indigo-600 font-bold' : 'text-slate-600'}`;
            renderApp();
        }

        // Add / Edit Modal Logic
        let currentFrontBase64 = '';
        let currentBackBase64 = '';

        function openAddModal() {
            document.getElementById('artForm').reset();
            document.getElementById('artId').value = '';
            document.getElementById('artModalTitle').textContent = '작품 정보 등록';
            document.getElementById('frontImgPreview').innerHTML = '<span class="text-xs text-slate-400">이미지 없음</span>';
            document.getElementById('backImgPreview').innerHTML = '<span class="text-xs text-slate-400">이미지 없음</span>';
            currentFrontBase64 = '';
            currentBackBase64 = '';
            document.getElementById('artModal').classList.remove('hidden');
        }

        function closeArtModal() {
            document.getElementById('artModal').classList.add('hidden');
        }

        // Image file reading
        document.getElementById('frontImgInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    currentFrontBase64 = evt.target.result;
                    document.getElementById('frontImgPreview').innerHTML = `<img src="${currentFrontBase64}" class="h-full object-contain">`;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('backImgInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    currentBackBase64 = evt.target.result;
                    document.getElementById('backImgPreview').innerHTML = `<img src="${currentBackBase64}" class="h-full object-contain">`;
                };
                reader.readAsDataURL(file);
            }
        });

        function calcDiscount() {
            const list = Number(document.getElementById('listPrice').value) || 0;
            const buy = Number(document.getElementById('purchasePrice').value) || 0;
            const display = document.getElementById('discountDisplay');

            if (list > 0 && buy > 0) {
                const discount = list - buy;
                const rate = ((discount / list) * 100).toFixed(1);
                display.value = `${rate}% (₩${discount.toLocaleString()} 할인)`;
            } else {
                display.value = '';
            }
        }

        async function handleArtSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('artId').value || 'art_' + Date.now();
            const existing = artworks.find(a => a.id === id) || {};

            const artworkData = {
                id: id,
                artist: document.getElementById('artist').value,
                title: document.getElementById('title').value,
                year: document.getElementById('year').value,
                size: document.getElementById('size').value,
                medium: document.getElementById('medium').value,
                genre: document.getElementById('genre').value,
                listPrice: document.getElementById('listPrice').value,
                purchasePrice: document.getElementById('purchasePrice').value,
                currentPrice: document.getElementById('currentPrice').value || document.getElementById('purchasePrice').value,
                gallery: document.getElementById('gallery').value,
                purchaseDate: document.getElementById('purchaseDate').value,
                notes: document.getElementById('notes').value,
                frontImg: currentFrontBase64 || existing.frontImg || '',
                backImg: currentBackBase64 || existing.backImg || '',
                history: existing.history || []
            };

            await saveArtworkToDB(artworkData);
            await loadArtworks();
            closeArtModal();
            renderApp();
        }

        function editArtwork(id) {
            const art = artworks.find(a => a.id === id);
            if (!art) return;

            document.getElementById('artId').value = art.id;
            document.getElementById('artist').value = art.artist || '';
            document.getElementById('title').value = art.title || '';
            document.getElementById('year').value = art.year || '';
            document.getElementById('size').value = art.size || '';
            document.getElementById('medium').value = art.medium || '';
            document.getElementById('genre').value = art.genre || '서양화';
            document.getElementById('listPrice').value = art.listPrice || '';
            document.getElementById('purchasePrice').value = art.purchasePrice || '';
            document.getElementById('currentPrice').value = art.currentPrice || '';
            document.getElementById('gallery').value = art.gallery || '';
            document.getElementById('purchaseDate').value = art.purchaseDate || '';
            document.getElementById('notes').value = art.notes || '';

            currentFrontBase64 = art.frontImg || '';
            currentBackBase64 = art.backImg || '';

            document.getElementById('frontImgPreview').innerHTML = currentFrontBase64 ? `<img src="${currentFrontBase64}" class="h-full object-contain">` : '<span class="text-xs text-slate-400">이미지 없음</span>';
            document.getElementById('backImgPreview').innerHTML = currentBackBase64 ? `<img src="${currentBackBase64}" class="h-full object-contain">` : '<span class="text-xs text-slate-400">이미지 없음</span>';

            calcDiscount();
            document.getElementById('artModalTitle').textContent = '작품 정보 수정';
            document.getElementById('artModal').classList.remove('hidden');
        }

        async function deleteArtwork(id) {
            if (confirm('이 작품 정보를 정말 삭제하시겠습니까?')) {
                await deleteArtworkFromDB(id);
                await loadArtworks();
                renderApp();
            }
        }

        // Valuation History Log Logic
        function openHistoryModal(id) {
            currentHistoryArtId = id;
            const art = artworks.find(a => a.id === id);
            if (!art) return;

            document.getElementById('historyArtworkTitle').textContent = `${art.artist} - ${art.title}`;
            document.getElementById('histDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('histPrice').value = '';

            renderHistoryTable(art);
            document.getElementById('historyModal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.add('hidden');
        }

        function renderHistoryTable(art) {
            const tbody = document.getElementById('historyTableBody');
            const history = art.history || [];

            if (history.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center p-4 text-slate-400">기록된 시세 변경 내역이 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = history.map((item, idx) => `
                <tr>
                    <td class="p-2.5">${item.date}</td>
                    <td class="p-2.5 font-bold text-indigo-600">₩${Number(item.price).toLocaleString()}</td>
                    <td class="p-2.5 text-right">
                        <button onclick="deletePriceHistory(${idx})" class="text-red-500 hover:underline">삭제</button>
                    </td>
                </tr>
            `).join('');
        }

        async function addPriceHistory() {
            const date = document.getElementById('histDate').value;
            const price = document.getElementById('histPrice').value;

            if (!date || !price) {
                alert('날짜와 평가 금액을 모두 입력해주세요.');
                return;
            }

            const art = artworks.find(a => a.id === currentHistoryArtId);
            if (!art) return;

            if (!art.history) art.history = [];
            art.history.unshift({ date, price: Number(price) });
            art.currentPrice = Number(price);

            await saveArtworkToDB(art);
            await loadArtworks();
            renderHistoryTable(art);
            renderApp();

            document.getElementById('histPrice').value = '';
        }

        async function deletePriceHistory(idx) {
            const art = artworks.find(a => a.id === currentHistoryArtId);
            if (!art || !art.history) return;

            art.history.splice(idx, 1);
            if (art.history.length > 0) {
                art.currentPrice = art.history[0].price;
            }

            await saveArtworkToDB(art);
            await loadArtworks();
            renderHistoryTable(art);
            renderApp();
        }

        // Backup / Restore / Export
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(artworks, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `art_vault_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        for (const art of importedData) {
                            await saveArtworkToDB(art);
                        }
                        await loadArtworks();
                        renderApp();
                        alert('성공적으로 백업 데이터를 복원했습니다!');
                    } else {
                        alert('올바른 백업 파일 형식이 아닙니다.');
                    }
                } catch (err) {
                    alert('파일을 읽는 중 오류가 발생했습니다.');
                }
            };
            reader.readAsText(file);
        }

        function exportCSV() {
            if (artworks.length === 0) {
                alert('내보낼 데이터가 없습니다.');
                return;
            }

            let csvContent = "\uFEFF작가명,작품명,년도,크기,재료,장르,정가,구입가,현재평가가,구입갤러리,구입일자,비고\n";

            artworks.forEach(a => {
                const row = [
                    a.artist || '',
                    a.title || '',
                    a.year || '',
                    a.size || '',
                    a.medium || '',
                    a.genre || '',
                    a.listPrice || 0,
                    a.purchasePrice || 0,
                    a.currentPrice || 0,
                    a.gallery || '',
                    a.purchaseDate || '',
                    (a.notes || '').replace(/\n/g, ' ')
                ].map(v => `"${v}"`).join(",");
                csvContent += row + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `art_collection_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            link.remove();
        }
    </script>
</body>
</html>
